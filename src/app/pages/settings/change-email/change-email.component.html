<app-overlay>
  <div class="p-6 max-w-full overflow-hidden">
    <h2 class="text-xl font-bold mb-4 truncate">Change Email</h2>
    <form class="min-w-0">
      <div class="mb-6">
        <label class="block text-sm font-medium mb-2">Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter new email address"
        />
      </div>
      <div class="flex flex-col gap-4 min-w-0">
        <button
          type="button"
          class="px-2 md:px-6 py-2 bg-blue-500 text-white font-medium rounded-md hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed w-full"
          (click)="submit()"
          [disabled]="!isEmailValid()"
        >
          Save and send verification code
        </button>
        <button
          type="button"
          class="px-2 md:px-6 py-2 text-gray-500 font-medium hover:text-gray-700 transition-colors truncate"
          (click)="cancel()"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</app-overlay>

<app-overlay>
  <div class="p-6">
    <h2 class="text-xl font-bold mb-4 truncate">Change Password</h2>
    <form>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-2">Old Password</label>
        <input
          type="password"
          [(ngModel)]="oldPassword"
          name="oldPassword"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter old password"
        />
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-2">New Password</label>
        <input
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter new password"
        />
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium mb-2">Confirm New Password</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Confirm new password"
        />
      </div>
      <div class="flex flex-col gap-4">
        <button
          type="button"
          class="px-6 py-2 bg-blue-500 text-white font-medium rounded-md hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed truncate"
          (click)="submit()"
          [disabled]="!isPasswordValid()"
        >
          Change
        </button>
        <button
          type="button"
          class="px-6 py-2 text-gray-500 font-medium hover:text-gray-700 transition-colors truncate"
          (click)="cancel()"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</app-overlay>
